name: ci

on:
  push:
  pull_request:

jobs:
  architecture-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: architecture-check
        # Entry point delegates to scripts/architecture/architecture_check.sh
        # (canonical layer rules, including application sqlite ban restored from
        # origin/main). Do not point CI at a divergent duplicate.
        run: bash scripts/architecture_check.sh
      - name: architecture-violation-tests
        # Fixtures must fail the checker; clean tree must pass. No ignore lists.
        # Includes application-sqlite-include among positive violation proofs.
        run: bash scripts/architecture/run_violation_tests.sh
      - name: backup-restore-recipe-regression
        # F3 documented fail-closed tar recipe (scripts/test_backup_restore_recipe.sh).
        # No Qt required; keep on architecture-check job.
        run: bash scripts/test_backup_restore_recipe.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev \
            libsqlite3-dev libgl1-mesa-dev libxkbcommon-dev \
            libdbus-1-dev
      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNOTES_BUILD_TESTS=ON \
            -DNOTES_BUILD_UI=ON
      - name: Build
        run: cmake --build build
      - name: Test (headless, not visual smoke)
        env:
          QT_QPA_PLATFORM: offscreen
          LC_ALL: C.UTF-8
        run: ctest --test-dir build --output-on-failure
