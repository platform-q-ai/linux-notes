[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters/sqlite",
    "crates/adapters/presentation",
    "crates/adapters/system",
    "crates/desktop",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Inner core: zero in-workspace deps, std only.
rusty-notes-domain = { path = "crates/domain" }
rusty-notes-application = { path = "crates/application" }

# Outer adapters.
rusty-notes-sqlite = { path = "crates/adapters/sqlite" }
rusty-notes-presentation = { path = "crates/adapters/presentation" }
rusty-notes-system = { path = "crates/adapters/system" }

# Test-only support: dev-dependencies ONLY — must never appear in a production
# dependency graph (the CI architecture check enforces this).
rusty-notes-test-support = { path = "crates/test-support" }

# GUI stack — pinned exactly (ADR-0001): egui/eframe 0.x breaks between minors,
# so upgrades are deliberate single-purpose chores, never loose semver drift.
eframe = "=0.36.2"
egui = "=0.36.2"

# Persistence (ADR-0002): bundled SQLite removes the distro-build variable and
# guarantees the FTS5 canary (ADR-0003) runs against a known-good build.
rusqlite = { version = "0.37", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
anyhow = "1"
tempfile = "3"  # dev-dependency only (test fixtures)

[profile.dev]
debug = 1
